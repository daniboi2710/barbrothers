<meta charset="utf-8">
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #111; overflow: hidden; }
#stage { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: #fff; font-family: "Inter Display", Inter, sans-serif; }
